name: Oracle Score attestor

on:
  schedule:
    - cron: '20 * * * *'   # hourly, offset off the hour to avoid runner congestion
  workflow_dispatch:       # manual runs for testing

# Two overlapping runs would both read the same pending records and try to
# record them twice, so only one may be in flight at a time.
concurrency:
  group: oracle-score-attest
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    # The job holds a signing mnemonic. A run that hangs holds it for six hours.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it hard-fails when the repo has no
      # lockfile, and four small pure-JS packages are not worth that coupling.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deps come from package.json, which already declares exactly these.
      # --ignore-scripts matters: this job has ATTESTOR_MNEMONIC in scope, and a
      # postinstall hook anywhere in the dependency tree would run with it.
      # tiny-secp256k1 v2 ships prebuilt WASM, so nothing here needs to compile.
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning::no package-lock.json — installing unpinned versions"
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Drain pending REP queue
        env:
          WORKER_URL: https://terra-oracle-questions.vladislav-baydan.workers.dev
          ACTIONS_SECRET: ${{ secrets.ACTIONS_SECRET }}
          ATTESTOR_MNEMONIC: ${{ secrets.ATTESTOR_MNEMONIC }}
          ORACLE_SCORE_CONTRACT: terra1pj6t6v4czktz7znzq8xk2ny2yh7pdwen4jw8z4zz86zrac6ur9vqqkwcls
        run: node scripts/oracle-score-attest.js

      # A red run nobody looks at is a queue that stalls for a week. Silently
      # skipped if the secrets are not set.
      - name: Notify on failure
        if: failure() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Oracle Score attestor failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
