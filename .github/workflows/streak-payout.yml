name: Streak Milestone Payouts
on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

# Два одновременных запуска прочитали бы одну и ту же очередь и отправили бы
# каждую выплату дважды. Ручной запуск поверх расписания - самый вероятный
# способ это получить, поэтому в полёте всегда только один прогон.
concurrency:
  group: streak-payout
  cancel-in-progress: false

jobs:
  payout:
    runs-on: ubuntu-latest
    # Задание держит мнемонику для подписи. Зависший прогон держит её шесть часов.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Process streak payouts
        env:
          RESERVE_MNEMONIC: ${{ secrets.RESERVE_MNEMONIC }}
          ACTIONS_SECRET:   ${{ secrets.ACTIONS_SECRET }}
          WORKER_URL:       https://terra-oracle-questions.vladislav-baydan.workers.dev
        run: node scripts/streak-payout.js
