name: Cache busting

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'scripts/bust-cache.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    # The job's own commit re-triggers this workflow. That run finds the hashes
    # already correct, commits nothing, and stops — so there is no loop. Skipping
    # the bot outright would be worse: a hand edit pushed straight after the
    # bot's commit would never get stamped.
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stamp asset versions
        id: stamp
        run: node scripts/bust-cache.js index.html

      - name: Commit if anything changed
        if: steps.stamp.outputs.changed == 'true'
        run: |
          git config user.name  "cache-bust"
          git config user.email "cache-bust@terraoracle.io"
          git add index.html
          git commit -m "chore: stamp asset versions with content hashes"
          git push
