name: Cache busting

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'scripts/bust-cache.js'
  workflow_dispatch:

permissions:
  contents: write

# This job commits to index.html, which is itself a trigger path — so its own
# commit queues another run. That run finds the hashes already correct and does
# nothing, but if a hand push lands while one is in flight the two overlap and
# GitHub cancels the older one ("The operation was canceled" during checkout).
#
# Cancelling deliberately, and only the older run, keeps that tidy: the newest
# push is the one whose tree matters, and the job is idempotent, so losing an
# earlier run costs nothing.
concurrency:
  group: cache-bust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub runners. 22 is the current LTS; the
          # script uses only fs, path and crypto, so any modern version works.
          node-version: '22'

      - name: Stamp asset versions
        id: stamp
        run: node scripts/bust-cache.js index.html

      - name: Commit if anything changed
        if: steps.stamp.outputs.changed == 'true'
        run: |
          git config user.name  "cache-bust"
          git config user.email "cache-bust@terraoracle.io"
          git add index.html
          git commit -m "chore: stamp asset versions with content hashes"
          # A hand push may have landed while this job ran; rebase onto it
          # rather than failing, so a stamping run never blocks someone's work.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
