name: Treasury Distribution

on:
  schedule:
    # Каждую среду в 21:00 UTC. Час отступа от розыгрыша: тот работает в
    # 20:00 и отправляет казне её долю, а распределение считает от баланса -
    # одновременный запуск делал результат зависящим от того, кто успел первым.
    - cron: '0 21 * * 3'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (print plan without sending transactions)'
        required: false
        default: 'false'

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        run: npm install

      - name: Run treasury distribution
        env:
          TREASURY_MNEMONIC: ${{ secrets.TREASURY_MNEMONIC }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/treasury-distribute.js

      - name: Log completion
        if: always()
        run: echo "Treasury distribution completed at $(date -u)"
