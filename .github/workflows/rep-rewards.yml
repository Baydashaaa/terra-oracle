name: REP Rewards Payout
on:
  schedule:
    - cron: '0 20 * * 2'   # every Tuesday at 20:00 UTC
  workflow_dispatch:

# Скрипт считает доли от ТЕКУЩЕГО баланса кошелька наград. Два пересекающихся
# прогона посчитали бы разные суммы от разных остатков и раздали бы обе.
concurrency:
  group: rep-rewards
  cancel-in-progress: false

jobs:
  payout:
    runs-on: ubuntu-latest
    # Задание держит мнемонику для подписи. Зависший прогон держит её шесть часов.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Run REP rewards payout
        env:
          REWARDS_MNEMONIC: ${{ secrets.REWARDS_MNEMONIC }}
          ACTIONS_SECRET:   ${{ secrets.ACTIONS_SECRET }}
          WORKER_URL:       https://terra-oracle-questions.vladislav-baydan.workers.dev
        run: node scripts/rep-rewards.js
