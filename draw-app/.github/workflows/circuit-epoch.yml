name: Circuit - Rewards Epoch
# Раз в неделю: покупает TCO на всё, что накопилось от долей раундов, делит
# купленное пополам (награды / сжигание), пополняет claim-контракт,
# пересчитывает накопительное дерево и публикует корень.
#
# Момент выбран в такт недельному розыгрышу - понедельник 20:00 UTC.
# Точность здесь не нужна: эпоха ни к какому дедлайну не привязана, и если
# GitHub приедет на час позже (а он приезжает), ничего не изменится.
#
# Если накопилось меньше порога - скрипт тихо выходит, деньги остаются на
# кошельке выкупа и уйдут в следующую эпоху.
on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать расчёт, без покупки и публикации'
        type: boolean
        default: true
# Два запуска подряд купили бы дважды и раздали бы одни и те же начисления
# повторно. Отменять текущий нельзя - он может быть между покупкой и
# публикацией корня, поэтому новый ждёт.
concurrency:
  group: circuit-rewards-epoch
  cancel-in-progress: false

jobs:
  epoch:
    name: Buy TCO, split it, publish the tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # cosmwasm-stargate нужен дополнительно к набору circuit-draw.js:
      # покупка и публикация корня - это MsgExecuteContract, а не MsgSend.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Ловит поломки загрузки модулей ДО того, как скрипт тронет деньги.
      - name: Preflight
        run: node dev/_preflight.js

      # Формат дерева должен совпадать с контрактом побайтово. Самопроверка
      # идёт по эталонным хешам и стоит доли секунды - а расхождение дало бы
      # корректные на вид пруфы, которые контракт молча отвергает.
      - name: Verify the merkle format
        run: node merkle.js --self-test

      - name: Run epoch
        env:
          CIRCUIT_BUYBACK_MNEMONIC:   ${{ secrets.CIRCUIT_BUYBACK_MNEMONIC }}
          CIRCUIT_REWARDS_CONTRACT:   ${{ secrets.CIRCUIT_REWARDS_CONTRACT }}
          CIRCUIT_WORKER_URL:         ${{ secrets.CIRCUIT_WORKER_URL }}
          CIRCUIT_EPOCH_THRESHOLD_ULUNA: ${{ vars.CIRCUIT_EPOCH_THRESHOLD_ULUNA }}
          CIRCUIT_SLIPPAGE_BPS:       ${{ vars.CIRCUIT_SLIPPAGE_BPS }}
          DRY_RUN:                    ${{ inputs.dry_run && '1' || '0' }}
        run: node circuit-epoch.js

      # РЕЕСТР - СОСТОЯНИЕ, КОТОРОЕ НЕЛЬЗЯ ПОТЕРЯТЬ.
      #
      # В rewards-ledger.json записано, какие начисления уже пересчитаны в
      # TCO. Если покупка прошла, а коммит не доехал, следующая эпоха увидит
      # те же начисления необработанными и раздаст за них второй раз.
      # Поэтому push с повторами, а при неудаче - громкое падение, а не
      # тихий выход.
      #
      # if: always() - файлы могли записаться и при частичном сбое.
      # Коммитим ТОЧЕЧНО: шаг install работает в корне репозитория, и
      # `git add -A` утащил бы node_modules.
      - name: Commit ledger and proofs
        if: always()
        run: |
          if [ -z "$(git status --porcelain rewards-ledger.json rewards-proofs.json)" ]; then
            echo "нечего коммитить - эпоха не состоялась или запуск был холостым"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rewards-ledger.json rewards-proofs.json
          git commit -m "chore: circuit rewards epoch [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "реестр сохранён"
              exit 0
            fi
            echo "попытка $i не прошла, ждём 10 секунд"
            sleep 10
          done
          echo "::error::РЕЕСТР НЕ СОХРАНЁН. TCO уже куплен и роздан по дереву, но rewards-ledger.json не попал в репозиторий. НЕ ЗАПУСКАЙТЕ следующую эпоху, пока файл не будет закоммичен вручную - иначе те же начисления раздадутся повторно."
          exit 1
