name: Oracle Pool - Mirror rounds

# Розыгрыш живёт в контракте, а фронт (Winners, колесо, карточка победителя)
# читает winners.json и rounds/<round_id>.json. Этот воркфлоу переносит
# рассчитанные раунды из контракта в репозиторий.
#
#  20:20 - через четверть часа после расчёта в 20:05.
#  08:20 - подбор, если вечерний прогон не состоялся или расчёт опоздал.
#
# Скрипт идемпотентен и работает от состояния контракта: раунд с уже
# записанным contract_round_id пропускается, пропущенный прогон подхватывает
# следующий. Ключи не нужны - только чтение цепочки.
#
# Основной триггер - repository_dispatch из воркера сразу после того, как он
# увидел рассчитанный раунд в контракте. Кроны оставлены страховкой.
on:
  repository_dispatch:
    types: [run-mirror]
  schedule:
    - cron: '20 20 * * *'
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать, ничего не писать'
        required: false
        default: false
        type: boolean

concurrency:
  group: pool-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror settled rounds
        env:
          POOL_DAILY: terra1d9ga3dzhg63v6rmm8ahts55ekjpwlm6dusw5cwhpt60s6t0actqqsul6tm
          POOL_WEEKLY: terra19w39c3qz6kc756hap92x374reptah9kp5825f5c67hmquy383r5qd7dmd8
          # Первый раунд после переезда денег на контракты. Всё, что раньше,
          # разыгрывала старая офчейн-система, и записи за те даты в
          # winners.json уже есть - переносить их нельзя.
          MIRROR_FROM_DAILY: '23'
          MIRROR_FROM_WEEKLY: '4'
          # У repository_dispatch нет inputs, поэтому сравнение просто даёт
          # пустоту и режим остаётся боевым.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node .github/scripts/pool-mirror.js

      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain winners.json rounds/)" ]; then
            echo "нечего коммитить"
            exit 0
          fi
          git config user.name  "pool-mirror"
          git config user.email "pool-mirror@terraoracle.io"
          # Только эти два пути: в корне репо после прогонов остаётся мусор,
          # а node_modules сюда уезжать не должен ни при каких условиях.
          git add winners.json rounds/
          git commit -m "chore: mirror settled pool rounds"
          # Между checkout и push в main успевают лечь коммиты соседних
          # воркфлоу - без rebase push отбивается non-fast-forward, и запись
          # теряется. Так уже терялись розыгрыши 18-20 августа.
          git pull --rebase
          git push
