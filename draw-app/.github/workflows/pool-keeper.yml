name: Oracle Pool - Keeper

# Two runs a day, on purpose.
#
#  19:00 - open the next round while the current one is still taking entries.
#          That ordering is the whole guarantee: the seed is committed before
#          the round's participants exist. Running it an hour early leaves room
#          for GitHub's scheduling delay, which is routinely 10-30 minutes.
#  20:05 - settle whatever has closed. Late is harmless: the outcome is fixed
#          at close_time and revealing later cannot change it.
#
# Both steps are idempotent and work from on-chain state, so a missed run is
# picked up by the next one rather than needing a human.
#
# Основной триггер - repository_dispatch из воркера: он тикает раз в минуту и
# шлёт run-keeper, как только раунд закрылся. Планировщик GitHub 31 августа
# опоздал на три часа, а 1 сентября не запустил прогон вовсе, поэтому кроны
# ниже оставлены страховкой, а не основным путём.
on:
  repository_dispatch:
    types: [run-keeper]
  schedule:
    - cron: '0 16 * * *'
    - cron: '5 20 * * *'
    # Понедельник 18:00 UTC - бесплатные билеты в недельный раунд, за два
    # часа до его закрытия. После close_time контракт их не примет.
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'both'
        type: choice
        options: [open, settle, both, set-limits, free-entries]
      min_pot:
        description: 'Для set-limits: минимальный пот в uluna (500000000000 = 500 000 LUNC)'
        required: false
        default: ''
      min_entries:
        description: 'Для set-limits: минимум входов (5 = пять common или один rare)'
        required: false
        default: ''
      pool:
        description: 'Для set-limits: какой пул'
        required: false
        default: 'both'
        type: choice
        options: [daily, weekly, both]

concurrency:
  group: pool-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Версии зафиксированы намеренно: без этого npm ставит разные
        # минорные @cosmjs/stargate для клиента и для GasPrice, и проверка
        # instanceof падает на объекте из «чужой» копии пакета.
        run: npm ci --ignore-scripts

      - name: Decide action
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 18 * * 1" ]; then
            # Понедельничный крон - только билеты. Раунды он не трогает:
            # открывать и считать по-прежнему дело двух других запусков.
            echo "action=free-entries" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.client_payload.action }}" ]; then
            # Воркер может попросить конкретное действие; по умолчанию both,
            # который сначала считает закрытое, потом открывает следующее.
            echo "action=${{ github.event.client_payload.action }}" >> $GITHUB_OUTPUT
          else
            echo "action=both" >> $GITHUB_OUTPUT
          fi

      - name: Run keeper
        env:
          ORACLE_MASTER_SEED: ${{ secrets.ORACLE_MASTER_SEED }}
          POOL_KEEPER_MNEMONIC: ${{ secrets.POOL_KEEPER_MNEMONIC }}
          POOL_DAILY: terra1d9ga3dzhg63v6rmm8ahts55ekjpwlm6dusw5cwhpt60s6t0actqqsul6tm
          POOL_WEEKLY: terra19w39c3qz6kc756hap92x374reptah9kp5825f5c67hmquy383r5qd7dmd8
          # Читаются только действием set-min-pot, для остальных пустые.
          SET_MIN_POT: ${{ github.event.inputs.min_pot }}
          SET_MIN_ENTRIES: ${{ github.event.inputs.min_entries }}
          SET_POOL: ${{ github.event.inputs.pool }}
        run: node .github/scripts/pool-keeper.js ${{ steps.what.outputs.action }}
