<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Araignée Halloween suspendue et animée</title>
  <desc id="desc">Une araignée violette suspendue à un fil argenté rebondit en boucle toutes les 2,6 secondes. Fond transparent, dessin entièrement vectoriel.</desc>
  <defs>
    <radialGradient id="body" cx="32%" cy="24%" r="80%">
      <stop offset="0" stop-color="#8445d6"/>
      <stop offset=".45" stop-color="#38135c"/>
      <stop offset="1" stop-color="#130b22"/>
    </radialGradient>
    <radialGradient id="head" cx="35%" cy="20%" r="85%">
      <stop offset="0" stop-color="#58307b"/>
      <stop offset="1" stop-color="#160c24"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#827596"/>
      <stop offset=".5" stop-color="#eee4ff"/>
      <stop offset="1" stop-color="#a99bbd"/>
    </linearGradient>
    <g id="legs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,-7 L-25,-17 L-29,-31 M-13,-2 L-34,-9 L-43,-23 M-14,5 L-36,9 L-46,24 M-11,12 L-27,23 L-30,39 M10,-7 L25,-17 L29,-31 M13,-2 L34,-9 L43,-23 M14,5 L36,9 L46,24 M11,12 L27,23 L30,39"/>
    </g>
  </defs>
  <path d="M80 0 V76" fill="none" stroke="url(#silk)" stroke-width="1.4">
    <animate attributeName="d" values="M80 0 V76;M80 0 V96;M80 0 V71;M80 0 V76" keyTimes="0;.5;.8;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(80 90)">
    <animateTransform attributeName="transform" type="translate" values="80 90;80 110;80 85;80 90" keyTimes="0;.5;.8;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"/>
    <use href="#legs" stroke="#a178cc" stroke-width="5.4"/>
    <use href="#legs" stroke="#21102f" stroke-width="3.6"/>
    <ellipse cx="0" cy="-2" rx="17" ry="22" fill="url(#body)" stroke="#b180e1" stroke-width="1.3"/>
    <ellipse cx="-6" cy="-12" rx="4.2" ry="6" transform="rotate(25 -6 -12)" fill="#cf9aff" opacity=".4"/>
    <ellipse cx="0" cy="16" rx="12" ry="10" fill="url(#head)" stroke="#9164b3" stroke-width="1"/>
    <path d="M-7 23 L-4 29 L-3 23 M7 23 L4 29 L3 23" fill="#e9d8fc"/>
    <path d="M-9 12 Q-5 11 -2 16 Q-7 20 -9 12 M9 12 Q5 11 2 16 Q7 20 9 12" fill="#ff9a24"/>
    <circle cx="-6" cy="14" r="1.1" fill="#fff4bc"/>
    <circle cx="6" cy="14" r="1.1" fill="#fff4bc"/>
  </g>
</svg>
